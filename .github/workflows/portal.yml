name: Public intake progress and Pages
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
concurrency:
  group: public-portal
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate minimized pending-only feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -c 'import json,portal; ledger=json.load(open("intake-ledger.json")); result=portal.collect(ledger=ledger,include_ledger=True); json.dump(result.pop("_ledger"),open("intake-ledger.json","w"),indent=2); json.dump(result,open("progress.json","w"),indent=2)'
      - name: Preserve feed on owned repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add progress.json intake-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Update minimized follow-up progress feed"
            git push origin HEAD:main
          fi
      - name: Stage only public portal files
        run: |
          mkdir _site
          cp index.html *.js *.py *.md *.json *.zip _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
