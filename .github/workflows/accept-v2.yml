name: Account-neutral v2 public acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: No-account public HTTP roundtrip (QA excluded)
        run: python3 .github/scripts/accept_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-v2-acceptance
          path: acceptance.json
          retention-days: 30
