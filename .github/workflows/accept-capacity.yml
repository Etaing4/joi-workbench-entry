name: Durable capacity recovery acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Twelve external clients sustained durable mutations (QA only)
        run: python3 .github/scripts/accept_capacity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-acceptance
          path: capacity-acceptance.json
          retention-days: 30
